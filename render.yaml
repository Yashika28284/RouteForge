services:
  - type: web
    name: routeforge-optimize-service
    runtime: docker
    dockerfilePath: ./optimize-service/Dockerfile
    dockerContext: ./optimize-service
    plan: free
    envVars:
      - key: PORT
        value: 8000

  - type: web
    name: routeforge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste your Neon connection string here (Dashboard -> Connect,
      # "Pooled connection" recommended). Must be a postgresql:// URL.
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSL
        value: "true"
      # Paste your Upstash Redis connection string here (rediss://...).
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Update this to your deployed Vercel URL after the frontend is live,
      # e.g. https://routeforge.vercel.app (comma-separate multiple exact
      # origins if needed; no trailing slash).
      - key: CORS_ORIGIN
        sync: false
      # Optional — only needed if you want Vercel preview-deploy URLs to
      # work against this backend too. Leave blank to allow only the exact
      # origin(s) in CORS_ORIGIN above.
      - key: CORS_ORIGIN_REGEX
        sync: false
      # The optimizer is now a public Free web service (not a private
      # service), so it gets its own onrender.com URL. Paste that URL
      # here once routeforge-optimize-service has deployed, e.g.
      # https://routeforge-optimize-service.onrender.com
      - key: OPTIMIZE_SERVICE_URL
        sync: false
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_USER_AGENT
        value: routeforge-app